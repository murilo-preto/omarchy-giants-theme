# Giants - Ghostty colors + window transparency.
# Palette copied from the generated template output; keep in sync with colors.toml.

background = #27241f
foreground = #E1D5C2
cursor-color = #e9e0d1
selection-background = #4f4840
selection-foreground = #e9e0d1

palette = 0=#27241f
palette = 1=#b3826a
palette = 2=#cac4a2
palette = 3=#fff2c8
palette = 4=#97786d
palette = 5=#c6a48e
palette = 6=#d9dfb2
palette = 7=#E1D5C2
palette = 8=#8a857a
palette = 9=#bea78c
palette = 10=#e2dbae
palette = 11=#fff1be
palette = 12=#b28b7e
palette = 13=#e3b89b
palette = 14=#f0f7c0
palette = 15=#e9e0d1

# Glass: see-through background (text stays crisp). Hyprland only blurs a GTK
# app behind a CSS backdrop-filter, which Omarchy's glass.css provides.
background-opacity = 0.85
gtk-custom-css = /usr/share/omarchy/default/gtk/glass.css
